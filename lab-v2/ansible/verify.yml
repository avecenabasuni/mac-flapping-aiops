---
- name: Read-only post-remediation verification
  hosts: lab_srlinux
  gather_facts: false
  tasks:
    - name: Read port and bridge-table state
      nokia.srlinux.get:
        paths:
          - path: /interface[name=ethernet-1/1]
            datastore: state
          - path: /interface[name=ethernet-1/2]
            datastore: state
          - path: /interface[name=ethernet-1/3]
            datastore: state
          - path: /network-instance[name=mac-flap]/bridge-table
            datastore: state
      register: verified

    - name: Report evidence, do not equate quiet logs with recovery
      ansible.builtin.debug:
        var: verified.result
