---
- name: Verify end-user forwarding from independent Host C
  hosts: lab_linux
  gather_facts: false
  tasks:
    - name: Wait for trusted endpoint connectivity to stabilize after port isolation
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - clab-macflap-v2-host-c
          - ping
          - -n
          - -I
          - eth1
          - -c
          - "5"
          - -i
          - "0.4"
          - -W
          - "1"
          - 198.18.0.11
      become: true
      changed_when: false
      register: probe
      until:
        - probe.rc == 0
        - >-
          (probe.stdout | default('') |
           regex_findall('(?m)(?:^|, +)([0-9]+(?:[.][0-9]+)?)% packet loss(?:,|$)') |
           map('float') | list) == [0.0]
      retries: 30
      delay: 10

    - name: Show independent forwarding verification
      ansible.builtin.debug:
        msg: "{{ probe.stdout }}"
